packages:
  - apps/*
  - packages/*

# Single source of truth for dependency versions shared by several workspace
# packages. Packages reference these with the `catalog:` protocol.
catalog:
  '@eslint/js': ^10.0.1
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^22.20.5
  '@vitejs/plugin-vue': ^6.0.9
  '@vue/eslint-config-typescript': ^14.9.0
  '@vue/test-utils': ^2.5.1
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-vue: ^10.11.1
  globals: ^17.13.0
  jsdom: ^30.1.0
  prettier: ^3.9.9
  tailwindcss: ^4.3.3
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vite: ^8.3.2
  vitest: ^5.0.3
  vue: ^3.5.43
  vue-tsc: ^3.3.12
  zod: ^4.6.5

# pnpm blocks dependency lifecycle scripts by default; only these may run them.
# esbuild's postinstall verifies its platform-specific binary.
allowBuilds:
  esbuild: true
